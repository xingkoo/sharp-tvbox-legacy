name: Build SHARP Android 4.4 compatibility APK

on:
  push:
    branches: [sharp-android44]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's historical default also asks sdkmanager for the
          # retired umbrella package named "tools", which now fails.  The
          # runner already has current command-line tools; only platform-tools
          # is needed before the pinned SDK packages below are installed.
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build unminified debug APK
        run: |
          chmod +x gradlew
          ./gradlew -PmusicSidecar --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sharp-tvbox-android44-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
